defaults:
  - pusht_stage1
  - _self_

output_dir: outputs/pusht_rwkv_v8_rollout_stage1_ds
resume_from: null

model:
  backend: rwkv7_cuda
  embed_dim: 192
  dynamics_dim: 384
  dynamics_layers: 6
  dropout: 0.1
  residual_prediction: false
  action_encoder_type: lewm
  prediction_head_type: direct
  action_modulation: none
  token_fusion: concat_action
  normalize_embeddings: true
  rollout_history_size: 3

loader:
  batch_size: 32
  num_workers: 3
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

trainer:
  max_epochs: 2
  max_steps: null
  gradient_clip_val: 1.0

optimizer:
  lr: 5e-5
  weight_decay: 1e-3
  betas: [0.9, 0.95]

