device: cuda
output_dir: outputs/rwkv_lewm
log_every: 20

encoder:
  image_size: 224
  patch_size: 14
  hidden_size: 192
  num_hidden_layers: 12
  num_attention_heads: 3
  intermediate_size: 768

model:
  backend: rwkv7_cuda
  embed_dim: 192
  dynamics_dim: 384
  dynamics_layers: 6
  dropout: 0.1
  residual_prediction: true
  action_encoder_type: mlp
  prediction_head_type: direct
  action_modulation: none
  token_fusion: concat_action

data:
  name: pusht_expert_train
  img_size: 224
  action_dim: 2
  frameskip: 5
  num_steps: 64
  keys_to_load:
    - pixels
    - action
    - proprio
    - state
  keys_to_cache:
    - action
    - proprio
    - state

loader:
  batch_size: 16
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

trainer:
  max_epochs: 10
  gradient_clip_val: 1.0

optimizer:
  lr: 5e-5
  weight_decay: 1e-3
  betas: [0.9, 0.95]

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
