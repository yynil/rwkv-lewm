defaults:
  - rwkv_lewm
  - _self_

output_dir: outputs/pusht_stage2
resume_from: outputs/pusht_stage1/rwkv_lewm_epoch_2.pt

model:
  residual_prediction: false
  action_encoder_type: lewm

data:
  name: pusht_expert_train
  img_size: 224
  action_dim: 2
  frameskip: 5
  # Match original LeWM: history_size=3, num_preds=1.
  num_steps: 4
  keys_to_load:
    - pixels
    - action
    - proprio
    - state
  keys_to_cache:
    - action
    - proprio
    - state

loader:
  batch_size: 4
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

trainer:
  # Stage 1 runs 2 epochs; 8 continuation epochs gives 10 total passes,
  # matching the PushT budget described in the LeWM paper.
  max_epochs: 8
  max_steps: null
  gradient_clip_val: 1.0

optimizer:
  lr: 5e-5
  weight_decay: 1e-3
  betas: [0.9, 0.95]

loss:
  mode: lewm_context
  history_size: 3
  num_preds: 1
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
