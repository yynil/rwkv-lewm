defaults:
  - pusht_lewmalign_v2_stage2
  - _self_

output_dir: outputs/pusht_lewmalign_v2_stage2_ds
resume_from: outputs/pusht_lewmalign_v2_stage1_ds/epoch_2

loader:
  # Match the successful reference LeWM DDP run: local batch 128 on each GPU.
  # If RWKV-v7 OOMs, override this from the launch command.
  batch_size: 128
  num_workers: 3
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

trainer:
  max_epochs: 8
  max_steps: null
  gradient_clip_val: 1.0

