defaults:
  - pusht_stage2
  - _self_

output_dir: outputs/pusht_lewmalign_stage2_ds
resume_from: outputs/pusht_lewmalign_stage1_ds/epoch_2

loader:
  # DeepSpeed uses this as per-GPU micro-batch. 32 * 4 GPUs = 128,
  # matching the original LeWM global batch size.
  batch_size: 32
  num_workers: 3
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

trainer:
  # Stage 1 runs 2 epochs; 8 continuation epochs gives 10 total passes,
  # matching the PushT budget described in the LeWM paper.
  max_epochs: 8
  max_steps: null
  gradient_clip_val: 1.0
