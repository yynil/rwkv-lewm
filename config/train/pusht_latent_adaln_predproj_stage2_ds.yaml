defaults:
  - pusht_latent_adaln_predproj_stage2
  - _self_

output_dir: outputs/pusht_latent_adaln_predproj_stage2_ds
resume_from: outputs/pusht_latent_adaln_predproj_stage1_ds/epoch_2

loader:
  # 32 * 4 GPUs = 128 global batch, matching the LeWM PushT run.
  batch_size: 32
  num_workers: 3
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

trainer:
  # Stage 1 is 2 epochs; this adds 8 epochs for the 10-epoch PushT budget.
  max_epochs: 8
  max_steps: null
  gradient_clip_val: 1.0
