defaults:
  - pusht_stage1
  - _self_

output_dir: outputs/pusht_rwkv_v9_statecond_stage1_ds
resume_from: null

model:
  backend: rwkv7_cuda
  embed_dim: 192
  dynamics_dim: 192
  dynamics_layers: 6
  dropout: 0.1
  residual_prediction: false
  action_encoder_type: lewm
  prediction_head_type: lewm_pred_proj
  action_modulation: adaln_zero
  action_modulation_scope: full
  action_modulate_ffn: true
  action_residual_gate: adaln
  token_fusion: latent_identity
  normalize_embeddings: true
  rollout_history_size: 3
  modulate_v_first: false
  rwkv_output_init_scale: 0.5

loader:
  batch_size: 32
  num_workers: 3
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

trainer:
  max_epochs: 2
  max_steps: null
  gradient_clip_val: 1.0

optimizer:
  lr: 5e-5
  weight_decay: 1e-3
  betas: [0.9, 0.95]
