[project]
name = "rwkv-lewm"
version = "0.1.0"
description = "LeWorldModel-style latent world model with an RWKV trajectory dynamics backbone."
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.40",
    "ninja>=1.11",
    "pytorch-lightning>=1.9.5",
]

[project.optional-dependencies]
swm = [
    "stable-worldmodel>=0.0.6",
    "stable-pretraining>=0.1.6",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
